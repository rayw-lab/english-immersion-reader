  <script>
    window.__LESSON_DATA__ = {"meta": {"title": "Why Reliable AI Features Need Small Interfaces", "title_zh": "为什么可靠的 AI 功能需要更小的接口", "source": "Immersion Reader Demo", "url": "", "kind": "article", "lang": "en", "study_card": {"word_count": 1280, "segment_count": 22, "difficulty": "中高", "estimated_days": 3, "main_practice": "盲听 + 影子跟读 + 工程表达迁移", "value_points": ["吃透可靠性工程核心词汇: surface area / error budget / graceful degradation", "练习把概率系统讲清楚的工程长句", "迁移到 design note / PR 描述 / standup 三种工作写作"], "suggested_pace": "第 1 天 盲听全文 + 精读 §1-8 · 第 2 天 精读 §9-16 + 影子跟读 · 第 3 天 精读 §17-22 + 完成迁移任务"}}, "voice": {"engine": "edge", "voice": "en-US-AndrewNeural", "rate": "-20%", "speed": 0.8}, "segments": [{"id": "seg-01", "en": "A reliable AI feature usually starts with a smaller interface than the demo suggests. The demo shows what is possible, but the product interface decides what can be trusted every day. Most teams learn this the hard way: they ship the widest possible surface, watch it break in unexpected hands, and then spend a quarter walking it back. The teams that move fastest are usually the ones that promised the least at the start.", "tts": "A reliable A I feature usually starts with a smaller interface than the demo suggests. The demo shows what is possible, but the product interface decides what can be trusted every day. Most teams learn this the hard way: they ship the widest possible surface, watch it break in unexpected hands, and then spend a quarter walking it back. The teams that move fastest are usually the ones that promised the least at the start.", "zh": "可靠的 AI 功能，起步时的界面往往比演示暗示的更小。演示展示可能性，产品界面决定什么能每天被信任。多数团队是吃了亏才明白：先把暴露面铺到最大，看着它在意想不到的用法里出问题，再花一个季度往回收。跑得最快的团队，往往是开局承诺最少的那批。", "hard": [{"w": "reliable", "type": "word", "def": "可靠的;可长期信任的"}, {"w": "interface", "type": "term", "def": "接口;人与系统交互的边界"}, {"w": "the hard way", "type": "idiom", "def": "吃了亏才学会;通过教训"}]}, {"id": "seg-02", "en": "When a tool has a clear constraint, users know how to recover from failure. A fallback is not a sign of weakness; it is part of the contract. If the model cannot answer, say so plainly, and route the user to something deterministic. People forgive a system that fails loudly and predictably. They abandon a system that fails silently, because silent failure turns every future answer into a question.", "tts": "When a tool has a clear constraint, users know how to recover from failure. A fallback is not a sign of weakness; it is part of the contract. If the model cannot answer, say so plainly, and route the user to something deterministic. People forgive a system that fails loudly and predictably. They abandon a system that fails silently, because silent failure turns every future answer into a question.", "zh": "当工具有清晰约束时，用户知道失败后怎么恢复。兜底不是软弱，而是契约的一部分。模型答不了就直说，并把用户引到一条确定性的路径上。系统大声地、可预期地失败，人们会原谅；悄悄地失败，人们会离开——因为一次无声的失败会让之后每个答案都变成问号。", "hard": [{"w": "constraint", "type": "word", "def": "约束;限制条件"}, {"w": "fallback", "type": "term", "def": "兜底方案;主路径失败后的备用路径"}, {"w": "deterministic", "type": "term", "def": "确定性的;同输入必同输出"}]}, {"id": "seg-03", "en": "Engineers like to talk about surface area. Every input you accept, every flag you expose, every promise you make in the docs adds to it. A large surface area means a large blast radius: when something goes wrong, more users are standing inside the explosion. Cutting scope is therefore not a product compromise. It is a reliability tool, and often the cheapest one you have.", "tts": "Engineers like to talk about surface area. Every input you accept, every flag you expose, every promise you make in the docs adds to it. A large surface area means a large blast radius: when something goes wrong, more users are standing inside the explosion. Cutting scope is therefore not a product compromise. It is a reliability tool, and often the cheapest one you have.", "zh": "工程师爱谈暴露面。你接受的每个输入、暴露的每个开关、文档里许下的每个承诺，都在扩大它。暴露面大，波及面就大：出事时，站在爆炸范围里的用户更多。所以砍范围不是产品上的妥协，它是一种可靠性工具，而且常常是你手里最便宜的那个。", "hard": [{"w": "surface area", "type": "term", "def": "暴露面;系统对外承诺与入口的总和"}, {"w": "blast radius", "type": "term", "def": "故障波及面;出错时受影响的范围"}, {"w": "scope", "type": "word", "def": "范围;边界"}]}, {"id": "seg-04", "en": "AI features are probabilistic by nature. The same prompt can produce a brilliant answer on Monday and a mediocre one on Friday. Traditional software promises determinism: a function returns the same output for the same input. Language models break that promise quietly. The interface is where you decide how much of that uncertainty your users are forced to carry.", "tts": "A I features are probabilistic by nature. The same prompt can produce a brilliant answer on Monday and a mediocre one on Friday. Traditional software promises determinism: a function returns the same output for the same input. Language models break that promise quietly. The interface is where you decide how much of that uncertainty your users are forced to carry.", "zh": "AI 功能天生是概率性的。同一个 prompt，周一可能给出精彩答案，周五就变平庸。传统软件承诺确定性：同样输入返回同样输出。语言模型悄悄打破了这个承诺。而界面，正是你决定让用户背负多少不确定性的地方。", "hard": [{"w": "probabilistic", "type": "term", "def": "概率性的;输出带随机性"}, {"w": "mediocre", "type": "word", "def": "平庸的;不好不坏的"}, {"w": "determinism", "type": "term", "def": "确定性;行为完全可预测"}]}, {"id": "seg-05", "en": "A small interface acts like a narrow waist. On one side, the model can change, the prompts can be rewritten, the vendor can be swapped. On the other side, the user keeps a stable set of expectations. This is the same trick that made the internet protocol stack work: keep the middle thin and boring, and let both ends evolve freely.", "tts": "A small interface acts like a narrow waist. On one side, the model can change, the prompts can be rewritten, the vendor can be swapped. On the other side, the user keeps a stable set of expectations. This is the same trick that made the internet protocol stack work: keep the middle thin and boring, and let both ends evolve freely.", "zh": "小界面就像一个窄腰。一侧，模型可以换、prompt 可以重写、供应商可以替换；另一侧，用户保有一组稳定的预期。这正是互联网协议栈成功的老把戏：把中间做薄、做无聊，让两端自由进化。", "hard": [{"w": "narrow waist", "type": "term", "def": "窄腰架构;两侧自由演化的薄中间层"}, {"w": "vendor", "type": "word", "def": "供应商"}, {"w": "protocol stack", "type": "term", "def": "协议栈;分层网络协议体系"}]}, {"id": "seg-06", "en": "Borrow the idea of an error budget from site reliability engineering. Decide in advance how often the feature is allowed to be wrong, and what happens when it spends that budget. A summary that is wrong five percent of the time may be acceptable. A billing calculation that is wrong once is not. The acceptable error rate should shape the interface, not the other way around.", "tts": "Borrow the idea of an error budget from site reliability engineering. Decide in advance how often the feature is allowed to be wrong, and what happens when it spends that budget. A summary that is wrong five percent of the time may be acceptable. A billing calculation that is wrong once is not. The acceptable error rate should shape the interface, not the other way around.", "zh": "从 SRE 借来「错误预算」的概念。提前定好：这个功能允许错多少，预算花完了怎么办。摘要错百分之五也许能接受，计费算错一次就不行。应该由可接受的错误率来塑造界面，而不是反过来。", "hard": [{"w": "error budget", "type": "term", "def": "错误预算;预先允许的失败配额"}, {"w": "site reliability engineering", "type": "term", "def": "站点可靠性工程(SRE)"}, {"w": "billing", "type": "word", "def": "计费;账务"}]}, {"id": "seg-07", "en": "Design for graceful degradation from day one. When the model times out, show the cached result. When confidence is low, shrink the claim: present three candidate answers instead of one confident answer. When everything fails, fall back to the boring deterministic path that existed before the AI feature did. Users rarely notice graceful degradation, and that is exactly the point.", "tts": "Design for graceful degradation from day one. When the model times out, show the cached result. When confidence is low, shrink the claim: present three candidate answers instead of one confident answer. When everything fails, fall back to the boring deterministic path that existed before the A I feature did. Users rarely notice graceful degradation, and that is exactly the point.", "zh": "从第一天就为优雅降级做设计。模型超时，就展示缓存结果；置信度低，就收窄说法——给三个候选答案，而不是一个笃定答案；全都失败，就退回到 AI 功能出现之前那条无聊的确定性路径。用户很少注意到优雅降级，而这正是它的意义。", "hard": [{"w": "graceful degradation", "type": "term", "def": "优雅降级;故障时平滑降低服务等级"}, {"w": "cached", "type": "term", "def": "缓存的;预先存好的"}, {"w": "candidate", "type": "word", "def": "候选的"}]}, {"id": "seg-08", "en": "The best agent-native software lets the agent do the heavy preparation, while the human keeps control over the decisive moment. The agent can read ten files, draft three options, and surface the trade-offs. The human spends attention only where judgment actually matters. An interface that respects this division of labor feels calm; one that ignores it feels like babysitting.", "tts": "The best agent-native software lets the agent do the heavy preparation, while the human keeps control over the decisive moment. The agent can read ten files, draft three options, and surface the trade-offs. The human spends attention only where judgment actually matters. An interface that respects this division of labor feels calm; one that ignores it feels like babysitting.", "zh": "最好的 agent-native 软件，让 agent 做重准备，而人保有对决定性时刻的控制。agent 可以读十个文件、起草三个方案、把权衡摆上桌面；人只在真正需要判断的地方花注意力。尊重这种分工的界面让人安心，无视它的界面让人觉得自己在当保姆。", "hard": [{"w": "agent-native", "type": "term", "def": "以 agent 为默认协作者的产品形态"}, {"w": "division of labor", "type": "term", "def": "分工"}, {"w": "babysitting", "type": "word", "def": "当保姆;被迫全程盯防"}]}, {"id": "seg-09", "en": "Trust is accumulated in small denominations. Every kept promise deposits a coin; every silent failure withdraws ten. This asymmetry explains why mature products look conservative: they have done the math. A feature that is impressive once but unreliable twice has a negative balance, no matter how good the demo was.", "tts": "Trust is accumulated in small denominations. Every kept promise deposits a coin; every silent failure withdraws ten. This asymmetry explains why mature products look conservative: they have done the math. A feature that is impressive once but unreliable twice has a negative balance, no matter how good the demo was.", "zh": "信任是用小面额攒起来的。每兑现一个承诺存进一枚硬币，每出现一次无声失败取走十枚。这种不对称解释了为什么成熟产品看起来保守：他们算过这笔账。一个惊艳一次、失信两次的功能，余额是负的——demo 再好看也没用。", "hard": [{"w": "denominations", "type": "word", "def": "面额;币值单位"}, {"w": "asymmetry", "type": "word", "def": "不对称"}, {"w": "conservative", "type": "word", "def": "保守的;稳健的"}]}, {"id": "seg-10", "en": "You cannot fix what you cannot see. Reliable AI features log their inputs, their outputs, and the version of every prompt that produced them. Observability for probabilistic systems is not optional plumbing; it is the only way to answer the question, did we get worse last week, with evidence instead of vibes.", "tts": "You cannot fix what you cannot see. Reliable A I features log their inputs, their outputs, and the version of every prompt that produced them. Observability for probabilistic systems is not optional plumbing; it is the only way to answer the question, did we get worse last week, with evidence instead of vibes.", "zh": "看不见的东西修不了。可靠的 AI 功能会记录输入、输出，以及产出它们的每个 prompt 的版本。对概率系统来说，可观测性不是可有可无的管道工程；它是用证据而非感觉回答「我们上周是不是变差了」的唯一方式。", "hard": [{"w": "Observability", "type": "term", "def": "可观测性;从外部输出推断系统内部状态的能力"}, {"w": "plumbing", "type": "word", "def": "管道工程;不起眼的底层设施"}, {"w": "vibes", "type": "word", "def": "感觉;直觉(非正式)"}]}, {"id": "seg-11", "en": "Treat model behavior like code: version it, test it, and watch it regress. A prompt change is a deployment. A vendor model upgrade is a dependency bump that can break you on a Tuesday without a changelog. Teams that pin versions and keep a small evaluation set catch these breaks in hours. Teams that do not, hear about them from customers.", "tts": "Treat model behavior like code: version it, test it, and watch it regress. A prompt change is a deployment. A vendor model upgrade is a dependency bump that can break you on a Tuesday without a changelog. Teams that pin versions and keep a small evaluation set catch these breaks in hours. Teams that do not, hear about them from customers.", "zh": "把模型行为当代码对待：管版本、写测试、盯回归。改一个 prompt 就是一次上线；供应商升级模型，等于一次没有 changelog 的依赖升级，可能在某个周二把你弄崩。锁定版本、维护小评测集的团队，几小时内就能发现这种破坏；不这么做的团队，要等客户来告诉他们。", "hard": [{"w": "regress", "type": "word", "def": "回归;退化到更差状态"}, {"w": "dependency bump", "type": "term", "def": "依赖版本升级"}, {"w": "pin versions", "type": "term", "def": "锁定版本;固定依赖版本号"}]}, {"id": "seg-12", "en": "An evaluation set does not need to be large to be useful. Fifty real examples, collected from actual usage and reviewed by a human, beat five thousand synthetic ones. The goal is not statistical perfection. The goal is a tripwire: a cheap, fast signal that something important changed, firing before your users find out.", "tts": "An evaluation set does not need to be large to be useful. Fifty real examples, collected from actual usage and reviewed by a human, beat five thousand synthetic ones. The goal is not statistical perfection. The goal is a tripwire: a cheap, fast signal that something important changed, firing before your users find out.", "zh": "评测集不需要大才有用。五十条来自实际使用、经人工复核的例子，胜过五千条合成数据。目标不是统计学上的完美，而是一根绊线：一个便宜、快速的信号，在用户发现之前，先替你报警「有重要的东西变了」。", "hard": [{"w": "evaluation set", "type": "term", "def": "评测集;用于检验模型行为的样本集合"}, {"w": "synthetic", "type": "word", "def": "合成的;人造的"}, {"w": "tripwire", "type": "word", "def": "绊线;触发警报的机关"}]}, {"id": "seg-13", "en": "Latency is part of reliability. An answer that takes twelve seconds trains users to stop asking. Streaming helps, caching helps more, but the deepest fix is again the interface: ask for less, promise less, and the system has less work to do. Speed is a feature that users feel on every single interaction.", "tts": "Latency is part of reliability. An answer that takes twelve seconds trains users to stop asking. Streaming helps, caching helps more, but the deepest fix is again the interface: ask for less, promise less, and the system has less work to do. Speed is a feature that users feel on every single interaction.", "zh": "延迟是可靠性的一部分。一个要等十二秒的回答，会训练用户不再提问。流式输出有帮助，缓存帮助更大，但最根本的解法还是界面：要得少、承诺得少，系统要做的事就少。速度是用户在每一次交互里都能感受到的功能。", "hard": [{"w": "Latency", "type": "term", "def": "延迟;请求到响应的耗时"}, {"w": "Streaming", "type": "term", "def": "流式输出;边生成边返回"}, {"w": "caching", "type": "term", "def": "缓存;复用已计算的结果"}]}, {"id": "seg-14", "en": "Make destructive actions idempotent and reversible wherever the agent is involved. If the agent can send an email, it will one day send it twice. If it can delete a record, it will one day delete the wrong one. Dry runs, previews, and undo buttons are not luxury features in agent products. They are the seatbelts.", "tts": "Make destructive actions idempotent and reversible wherever the agent is involved. If the agent can send an email, it will one day send it twice. If it can delete a record, it will one day delete the wrong one. Dry runs, previews, and undo buttons are not luxury features in agent products. They are the seatbelts.", "zh": "凡是 agent 参与的破坏性操作，都要做成幂等、可逆。agent 能发邮件，总有一天会发两遍；能删记录，总有一天会删错。干跑、预览、撤销按钮在 agent 产品里不是奢侈品，是安全带。", "hard": [{"w": "idempotent", "type": "term", "def": "幂等的;重复执行结果不变"}, {"w": "reversible", "type": "word", "def": "可逆的;可撤销的"}, {"w": "Dry runs", "type": "term", "def": "干跑;只预演不实际执行"}]}, {"id": "seg-15", "en": "Autonomy should be scoped like permissions. Start with read-only access and let the agent earn the write path. Let it propose before it executes. The pattern is old: junior engineers do not get production keys on their first day, and a new model does not deserve them either. Capability is granted by track record, not by benchmark scores.", "tts": "Autonomy should be scoped like permissions. Start with read-only access and let the agent earn the write path. Let it propose before it executes. The pattern is old: junior engineers do not get production keys on their first day, and a new model does not deserve them either. Capability is granted by track record, not by benchmark scores.", "zh": "自主权要像权限一样分级。从只读开始，让 agent 自己挣到写路径；先提案，再执行。这套路数很老：新工程师入职第一天拿不到生产环境钥匙，新模型也一样。能力靠过往记录授予，不靠跑分。", "hard": [{"w": "Autonomy", "type": "word", "def": "自主权;独立行动的权限"}, {"w": "read-only", "type": "term", "def": "只读;不可修改"}, {"w": "track record", "type": "idiom", "def": "过往记录;实际表现历史"}]}, {"id": "seg-16", "en": "Beware the demo trap. A demo optimizes for the best case in front of a friendly audience; a product survives the worst case in front of a stranger. The distance between the two is where most AI projects die. Closing that distance is rarely about a better model. It is about narrowing the promise until you can keep it every time.", "tts": "Beware the demo trap. A demo optimizes for the best case in front of a friendly audience; a product survives the worst case in front of a stranger. The distance between the two is where most A I projects die. Closing that distance is rarely about a better model. It is about narrowing the promise until you can keep it every time.", "zh": "当心演示陷阱。演示在友好的观众面前优化最好情况；产品要在陌生人面前扛住最坏情况。两者之间的距离，是多数 AI 项目的死亡地带。缩短这段距离，很少靠更强的模型，而是靠把承诺收窄到每一次都能兑现。", "hard": [{"w": "demo trap", "type": "term", "def": "演示陷阱;演示效果与产品可靠性的鸿沟"}, {"w": "worst case", "type": "term", "def": "最坏情况"}, {"w": "narrowing", "type": "word", "def": "收窄;缩小"}]}, {"id": "seg-17", "en": "Small interfaces require saying no, and saying no requires organizational courage. Every stakeholder wants one more knob, one more input format, one more integration. Each request sounds cheap in isolation. A good product owner prices them honestly: every knob doubles the test matrix, and every integration dilutes the promise the feature can keep.", "tts": "Small interfaces require saying no, and saying no requires organizational courage. Every stakeholder wants one more knob, one more input format, one more integration. Each request sounds cheap in isolation. A good product owner prices them honestly: every knob doubles the test matrix, and every integration dilutes the promise the feature can keep.", "zh": "小界面意味着要说「不」，而说「不」需要组织层面的勇气。每个利益相关方都想再加一个旋钮、再支持一种输入格式、再接一个集成。单独看每个请求都便宜。靠谱的产品负责人会诚实定价：每个旋钮让测试矩阵翻倍，每个集成都在稀释这个功能能守住的承诺。", "hard": [{"w": "stakeholder", "type": "word", "def": "利益相关方"}, {"w": "knob", "type": "word", "def": "旋钮;可调参数"}, {"w": "test matrix", "type": "term", "def": "测试矩阵;需覆盖的配置组合全集"}]}, {"id": "seg-18", "en": "Documentation is the visible half of the contract. Write down what the feature does, what it refuses to do, and what the user should expect when it fails. If the docs are embarrassing to write because the failure modes are vague, that embarrassment is information: the interface is not finished yet.", "tts": "Documentation is the visible half of the contract. Write down what the feature does, what it refuses to do, and what the user should expect when it fails. If the docs are embarrassing to write because the failure modes are vague, that embarrassment is information: the interface is not finished yet.", "zh": "文档是契约里看得见的那一半。写清楚这个功能做什么、拒绝做什么、失败时用户该预期什么。如果失效模式模糊得让你写文档都难堪，这份难堪本身就是信息：界面还没做完。", "hard": [{"w": "refuses", "type": "word", "def": "拒绝"}, {"w": "failure modes", "type": "term", "def": "失效模式;系统可能出错的方式"}, {"w": "vague", "type": "word", "def": "模糊的;含糊不清的"}]}, {"id": "seg-19", "en": "A static lesson page should feel calm. It can remember local practice signals, but it should not pretend to be a full learning platform. The page does one job: it turns one article into one focused session of study. Anything heavier belongs to the agent outside the page, where capability can grow without making the reading surface noisier.", "tts": "A static lesson page should feel calm. It can remember local practice signals, but it should not pretend to be a full learning platform. The page does one job: it turns one article into one focused session of study. Anything heavier belongs to the agent outside the page, where capability can grow without making the reading surface noisier.", "zh": "静态学习页应该让人安静。它可以记住本地练习信号，但不该伪装成完整的学习平台。这页只做一件事：把一篇文章变成一段专注的学习。更重的能力属于页面之外的 agent——能力可以在那里生长，而不让阅读界面变得嘈杂。", "hard": [{"w": "static lesson page", "type": "term", "def": "静态学习页;无后端、可本地打开的课程页"}, {"w": "pretend to be", "type": "idiom", "def": "伪装成;装作是"}, {"w": "noisier", "type": "word", "def": "更嘈杂的"}]}, {"id": "seg-20", "en": "When an AI feature fails in production, run the same blameless review you would run for an outage. What did the user expect? What did the system promise? Where did the two diverge? Most post-mortems of AI failures end at the same root cause: the interface promised judgment, but the system only had statistics.", "tts": "When an A I feature fails in production, run the same blameless review you would run for an outage. What did the user expect? What did the system promise? Where did the two diverge? Most post-mortems of A I failures end at the same root cause: the interface promised judgment, but the system only had statistics.", "zh": "AI 功能在生产环境出事时，用对待停机事故的同一套不追责复盘来处理。用户期待什么？系统承诺了什么？两者在哪里分了叉？多数 AI 故障复盘最后都停在同一个根因上：界面承诺了判断力，而系统只有统计。", "hard": [{"w": "blameless", "type": "word", "def": "不追责的;对事不对人的"}, {"w": "outage", "type": "word", "def": "停机事故;服务中断"}, {"w": "post-mortems", "type": "term", "def": "事后复盘"}]}, {"id": "seg-21", "en": "Reliability compounds. A feature trusted for six months gets invited into bigger workflows, which generates better usage data, which funds a better evaluation set, which makes the next feature easier to trust. The flywheel starts small. It starts, almost always, with one boring promise kept a thousand times.", "tts": "Reliability compounds. A feature trusted for six months gets invited into bigger workflows, which generates better usage data, which funds a better evaluation set, which makes the next feature easier to trust. The flywheel starts small. It starts, almost always, with one boring promise kept a thousand times.", "zh": "可靠性会复利。被信任六个月的功能会被请进更大的工作流，带来更好的使用数据，反哺更好的评测集，让下一个功能更容易被信任。飞轮起步时很小——几乎总是从一个无聊的承诺被兑现一千次开始。", "hard": [{"w": "compounds", "type": "word", "def": "复利式增长;不断累积放大"}, {"w": "flywheel", "type": "term", "def": "飞轮;自我强化的增长循环"}, {"w": "workflows", "type": "word", "def": "工作流"}]}, {"id": "seg-22", "en": "So start smaller than feels comfortable. Pick the narrowest version of the feature that is still useful, wrap it in a clear constraint, give it an honest fallback, and ship it. Let the surface grow only as fast as your evidence does. The demo impresses people once. The small reliable interface is what they build their day around.", "tts": "So start smaller than feels comfortable. Pick the narrowest version of the feature that is still useful, wrap it in a clear constraint, give it an honest fallback, and ship it. Let the surface grow only as fast as your evidence does. The demo impresses people once. The small reliable interface is what they build their day around.", "zh": "所以，从比舒适区更小的地方开始。挑出这个功能仍然有用的最窄版本，套上清晰的约束，配上诚实的兜底，然后发布。让暴露面增长的速度不超过证据增长的速度。演示只能打动人一次；让人把每天的工作建立在它之上的，是那个小而可靠的界面。", "hard": [{"w": "narrowest", "type": "word", "def": "最窄的"}, {"w": "build their day around", "type": "idiom", "def": "把日常工作安排在……之上"}]}], "chunks": [{"t": "clear constraint", "cn": "清晰约束", "eg": "This design note starts with a clear constraint."}, {"t": "recover from failure", "cn": "从失败中恢复", "eg": "The workflow helps the user recover from failure."}, {"t": "part of the contract", "cn": "契约的一部分", "eg": "The fallback is part of the contract."}, {"t": "surface area", "cn": "暴露面", "eg": "Every new flag quietly adds surface area."}, {"t": "blast radius", "cn": "故障波及面", "eg": "A staged rollout keeps the blast radius small."}, {"t": "error budget", "cn": "错误预算", "eg": "This quarter we spent our error budget on the migration."}, {"t": "graceful degradation", "cn": "优雅降级", "eg": "Caching gives us graceful degradation when the model times out."}, {"t": "earn the write path", "cn": "挣到写权限", "eg": "The agent starts read-only and earns the write path."}, {"t": "narrow the promise", "cn": "收窄承诺", "eg": "We narrowed the promise until we could keep it every time."}, {"t": "track record", "cn": "过往记录", "eg": "Autonomy is granted by track record, not by benchmark scores."}], "patterns": [{"t": "A reliable X usually starts with Y.", "cn": "可靠的 X 通常从 Y 开始。"}, {"t": "X is not a sign of weakness; it is part of Y.", "cn": "X 不是弱点, 而是 Y 的一部分。"}, {"t": "You cannot X what you cannot Y.", "cn": "你无法 X 你无法 Y 的东西。"}, {"t": "The acceptable X should shape Y, not the other way around.", "cn": "应由可接受的 X 来塑造 Y, 而不是反过来。"}, {"t": "X is granted by Y, not by Z.", "cn": "X 由 Y 授予, 而不是由 Z。"}, {"t": "Let X grow only as fast as Y does.", "cn": "让 X 的增长不超过 Y 的速度。"}], "transfer_tasks": [{"genre": "design_note", "task": "Write a 5-8 sentence design note for a new AI feature using clear constraint, recover from failure, and part of the contract.", "hint_chunks": ["clear constraint", "recover from failure", "part of the contract"]}], "lexicon": {"abandon": {"def": "放弃;弃用", "ipa": "/əˈbændən/"}, "accept": {"def": "接受", "ipa": "/əkˈsɛpt/"}, "acceptable": {"lemma": "accept"}, "access": {"def": "访问权限", "ipa": "/ˈækˌsɛs/"}, "accumulate": {"def": "累积", "ipa": "/əˈkjumjəˌleɪt/"}, "accumulated": {"lemma": "accumulate"}, "act": {"def": "起作用", "ipa": "/ækt/"}, "action": {"def": "操作;动作", "ipa": "/ˈækʃən/"}, "actions": {"lemma": "action"}, "acts": {"lemma": "act"}, "actual": {"def": "实际的", "ipa": "/ˈæktʃuəl/"}, "actually": {"def": "实际上", "ipa": "/ˈæktʃuəli/"}, "add": {"def": "增加", "ipa": "/æd/"}, "adds": {"lemma": "add"}, "advance": {"def": "预先", "ipa": "/ədˈvæns/"}, "agent": {"def": "代理;智能体", "ipa": "/ˈeɪdʒənt/"}, "agent-native": {"def": "agent 原生", "ipa": "/ˈeɪdʒənt ˈneɪtɪv/"}, "allow": {"def": "允许", "ipa": "/əˈlaʊ/"}, "allowed": {"lemma": "allow"}, "almost": {"def": "几乎", "ipa": "/ˈɔlˌmoʊst/"}, "always": {"def": "总是", "ipa": "/ˈɔlˌweɪz/"}, "answer": {"def": "回答;答案", "ipa": "/ˈænsər/"}, "answers": {"lemma": "answer"}, "anything": {"def": "任何事", "ipa": "/ˈɛniˌθɪŋ/"}, "article": {"def": "文章", "ipa": "/ˈɑrtɪ
